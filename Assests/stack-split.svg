<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Development and systems exploration">
  <defs>
    <linearGradient id="hs2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14121C"/>
      <stop offset="100%" stop-color="#0B0A10"/>
    </linearGradient>
    <linearGradient id="hs2-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D2A52"/>
      <stop offset="100%" stop-color="#241A33"/>
    </linearGradient>
    <linearGradient id="hs2-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241A33"/>
      <stop offset="100%" stop-color="#3D2A52"/>
    </linearGradient>
    <radialGradient id="hs2-v" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B57BEE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#B57BEE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hs2-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E49A5C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E49A5C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#hs2-bg)"/>
  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" fill="#B57BEE" letter-spacing="3">
    <text x="60" y="46">02 / TWO TRACKS</text>
  </g>

  <!-- Left card (larger, 60%) -->
  <g>
    <rect x="60" y="80" width="660" height="280" rx="14" fill="url(#hs2-left)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="80" width="660" height="280" rx="14" fill="none" stroke="#B57BEE" stroke-width="1" stroke-opacity="0.4">
      <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="6s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="720" cy="100" rx="140" ry="80" fill="url(#hs2-v)">
      <animate attributeName="rx" values="120;180;120" dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <text x="90" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#F2EEF8">Development</text>
    <rect x="90" y="142" width="120" height="2" fill="#B57BEE">
      <animate attributeName="width" values="40;140;40" dur="5s" repeatCount="indefinite"/>
    </rect>

    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B9AFC9">
      <circle cx="100" cy="180" r="3" fill="#B57BEE"/><text x="116" y="185">React, Vite, Tailwind CSS</text>
      <circle cx="100" cy="215" r="3" fill="#B57BEE"/><text x="116" y="220">Responsive UI and frontend fundamentals</text>
      <circle cx="100" cy="250" r="3" fill="#B57BEE"/><text x="116" y="255">Basic web application development</text>
      <circle cx="100" cy="285" r="3" fill="#B57BEE"/><text x="116" y="290">Python programming</text>
    </g>

    <!-- Bar meters -->
    <g transform="translate(90 320)">
      <rect x="0" y="0" width="200" height="4" rx="2" fill="#241A33"/>
      <rect x="0" y="0" width="160" height="4" rx="2" fill="#B57BEE">
        <animate attributeName="width" values="60;160;60" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="230" y="0" width="200" height="4" rx="2" fill="#241A33"/>
      <rect x="230" y="0" width="120" height="4" rx="2" fill="#E49A5C">
        <animate attributeName="width" values="50;120;50" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="20" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#B9AFC9">FRONTEND</text>
      <text x="230" y="20" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#B9AFC9">PYTHON</text>
    </g>
  </g>

  <!-- Right card (smaller, 40%) -->
  <g>
    <rect x="740" y="80" width="400" height="280" rx="14" fill="url(#hs2-right)">
      <animate attributeName="opacity" values="1;0.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="740" y="80" width="400" height="280" rx="14" fill="none" stroke="#E49A5C" stroke-width="1" stroke-opacity="0.4">
      <animate attributeName="stroke-opacity" values="0.7;0.2;0.7" dur="6s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="780" cy="320" rx="140" ry="80" fill="url(#hs2-c)">
      <animate attributeName="rx" values="120;180;120" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <text x="770" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#F2EEF8">Systems &amp; exploration</text>
    <rect x="770" y="142" width="120" height="2" fill="#E49A5C">
      <animate attributeName="width" values="40;140;40" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9AFC9">
      <circle cx="780" cy="180" r="3" fill="#E49A5C"/><text x="796" y="185">Local AI model workflows</text>
      <circle cx="780" cy="215" r="3" fill="#E49A5C"/><text x="796" y="220">Linux, Ubuntu, and Kali Linux</text>
      <circle cx="780" cy="250" r="3" fill="#E49A5C"/><text x="796" y="255">Networking and security fundamentals</text>
      <circle cx="780" cy="285" r="3" fill="#E49A5C"/><text x="796" y="290">Hands-on troubleshooting</text>
    </g>

    <g transform="translate(770 320)">
      <rect x="0" y="0" width="160" height="4" rx="2" fill="#241A33"/>
      <rect x="0" y="0" width="130" height="4" rx="2" fill="#E49A5C">
        <animate attributeName="width" values="50;130;50" dur="7.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="180" y="0" width="160" height="4" rx="2" fill="#241A33"/>
      <rect x="180" y="0" width="90" height="4" rx="2" fill="#8FBF9F">
        <animate attributeName="width" values="40;90;40" dur="8.5s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="20" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#B9AFC9">AI / LINUX</text>
      <text x="180" y="20" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#B9AFC9">SECURITY</text>
    </g>
  </g>
</svg>
