<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="hff-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0A10"/>
      <stop offset="50%" stop-color="#14121C"/>
      <stop offset="100%" stop-color="#0B0A10"/>
    </linearGradient>
    <linearGradient id="hff-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D2A52"/>
      <stop offset="50%" stop-color="#B57BEE"/>
      <stop offset="100%" stop-color="#E49A5C"/>
    </linearGradient>
    <radialGradient id="hff-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B57BEE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#B57BEE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="180" fill="url(#hff-bg)" rx="16"/>
  <ellipse cx="600" cy="90" rx="360" ry="60" fill="url(#hff-glow)">
    <animate attributeName="rx" values="320;420;320" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <line x1="120" y1="56" x2="1080" y2="56" stroke="url(#hff-line)" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="x1" values="120;220;120" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1080;980;1080" dur="9s" repeatCount="indefinite"/>
  </line>

  <text x="600" y="106" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#B9AFC9" letter-spacing="4">
    BUILT WITH INTENT · DESIGNED WITH RESTRAINT
  </text>
  <text x="600" y="134" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#B57BEE" letter-spacing="2">
    Vikas Kanchugar
  </text>
  <circle cx="600" cy="156" r="2.5" fill="#E49A5C">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
