<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-labelledby="footerTitle footerDesc">
  <title id="footerTitle">Animated midnight blue footer</title>
  <desc id="footerDesc">A fine blue line with a moving teal highlight and a rotating orbital motif.</desc>
  <defs>
    <linearGradient id="footerFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0"/>
      <stop offset=".42" stop-color="#38BDF8"/>
      <stop offset=".55" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
      <animate attributeName="x1" values="-.5;.5;-.5" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values=".5;1.5;.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g stroke="#93C5FD" stroke-opacity=".2">
    <path d="M70 28V38M150 28V38M230 28V38M310 28V38M390 28V38M610 28V38M690 28V38M770 28V38M850 28V38M930 28V38"/>
  </g>
  <path d="M30 58H970" stroke="#1E3A8A" stroke-opacity=".7"/>
  <path d="M30 58H970" stroke="url(#footerFlow)" stroke-width="2"/>
  <g fill="none" stroke="#38BDF8" stroke-opacity=".8">
    <circle cx="500" cy="58" r="15"/>
    <circle cx="500" cy="58" r="27" stroke-dasharray="2 6">
      <animateTransform attributeName="transform" type="rotate" from="0 500 58" to="360 500 58" dur="35s" repeatCount="indefinite"/>
    </circle>
    <path d="M470 58H484M516 58H530" stroke="#2DD4BF"/>
  </g>
  <circle cx="500" cy="58" r="3.5" fill="#F8FAFC"/>
</svg>
