<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Learning journey timeline">
  <defs>
    <linearGradient id="ht-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0A10"/>
      <stop offset="100%" stop-color="#14121C"/>
    </linearGradient>
    <linearGradient id="ht-track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D2A52"/>
      <stop offset="50%" stop-color="#B57BEE"/>
      <stop offset="100%" stop-color="#E49A5C"/>
    </linearGradient>
    <radialGradient id="ht-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E49A5C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E49A5C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#ht-bg)"/>
  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" fill="#B57BEE" letter-spacing="3">
    <text x="60" y="46">03 / JOURNEY</text>
  </g>
  <text x="60" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F2EEF8">Learning journey</text>
  <text x="60" y="112" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#B9AFC9">A direction of travel, not a list of claims.</text>

  <line x1="100" y1="190" x2="1100" y2="190" stroke="url(#ht-track)" stroke-width="2" stroke-opacity="0.55"/>

  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#B57BEE" text-anchor="middle" letter-spacing="2">
    <text x="200" y="150">FUNDAMENTALS</text>
    <text x="450" y="150">FRONTEND</text>
    <text x="700" y="150">FULL-STACK</text>
    <text x="950" y="150">AI · SECURITY</text>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#B9AFC9" text-anchor="middle">
    <text x="200" y="240">Logic · Python basics</text>
    <text x="450" y="240">React · Vite · Tailwind</text>
    <text x="700" y="240">APIs · data · deployment</text>
    <text x="950" y="240">Local models · Linux · networks</text>
  </g>

  <g fill="#3D2A52">
    <circle cx="200" cy="190" r="10"/>
    <circle cx="450" cy="190" r="10"/>
    <circle cx="700" cy="190" r="10"/>
    <circle cx="950" cy="190" r="10"/>
  </g>
  <g fill="#F2EEF8">
    <circle cx="200" cy="190" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="190" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="190" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="190" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="200" cy="190" r="22" fill="url(#ht-glow)">
    <animate attributeName="cx" values="200;450;700;950;200" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="190" r="5" fill="#E49A5C">
    <animate attributeName="cx" values="200;450;700;950;200" dur="16s" repeatCount="indefinite"/>
  </circle>
</svg>
