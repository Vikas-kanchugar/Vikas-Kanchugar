<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Working principles">
  <defs>
    <linearGradient id="hp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14121C"/>
      <stop offset="100%" stop-color="#0B0A10"/>
    </linearGradient>
    <linearGradient id="hp-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D2A52"/>
      <stop offset="50%" stop-color="#8FBF9F"/>
      <stop offset="100%" stop-color="#B57BEE"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#hp-bg)"/>
  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" fill="#B57BEE" letter-spacing="3">
    <text x="60" y="46">08 / PRINCIPLES</text>
  </g>
  <text x="60" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#F2EEF8">How I work</text>
  <rect x="60" y="100" width="140" height="3" rx="1.5" fill="url(#hp-bar)">
    <animate attributeName="width" values="40;180;40" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#F2EEF8">
    <text x="60" y="150">Build small. Explain clearly. Iterate honestly.</text>
  </g>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9AFC9">
    <text x="60" y="180">I prefer starting with the smallest thing that works, then improving it with tests,</text>
    <text x="60" y="202">feedback, and reading my own code again. If I can't explain a decision, it isn't done.</text>
  </g>

  <!-- Three principle chips -->
  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#F2EEF8" letter-spacing="1">
    <g><rect x="60" y="220" width="180" height="26" rx="13" fill="#241A33"><animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/></rect><text x="150" y="237" text-anchor="middle">CLARITY FIRST</text></g>
    <g><rect x="258" y="220" width="180" height="26" rx="13" fill="#3D2A52"><animate attributeName="opacity" values="1;0.7;1" dur="5.5s" repeatCount="indefinite"/></rect><text x="348" y="237" text-anchor="middle">SMALL ITERATIONS</text></g>
    <g><rect x="456" y="220" width="180" height="26" rx="13" fill="#241A33"><animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/></rect><text x="546" y="237" text-anchor="middle">TEST BEFORE SHIP</text></g>
    <g><rect x="654" y="220" width="200" height="26" rx="13" fill="#3D2A52"><animate attributeName="opacity" values="1;0.7;1" dur="6.5s" repeatCount="indefinite"/></rect><text x="754" y="237" text-anchor="middle">DOCUMENT THE WHY</text></g>
    <g><rect x="872" y="220" width="180" height="26" rx="13" fill="#2A2138"><animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/></rect><text x="962" y="237" text-anchor="middle">STAY CURIOUS</text></g>
  </g>
</svg>
