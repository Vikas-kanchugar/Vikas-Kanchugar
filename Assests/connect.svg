<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Connect">
  <defs>
    <linearGradient id="hc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0A10"/>
      <stop offset="100%" stop-color="#14121C"/>
    </linearGradient>
    <linearGradient id="hc-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D2A52"/>
      <stop offset="50%" stop-color="#B57BEE"/>
      <stop offset="100%" stop-color="#E49A5C"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="hc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B57BEE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B57BEE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#hc-bg)"/>
  <ellipse cx="600" cy="130" rx="420" ry="90" fill="url(#hc-glow)">
    <animate attributeName="rx" values="380;460;380" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#B57BEE" letter-spacing="3">
    <text x="60" y="46">11 / CONNECT</text>
  </g>

  <text x="600" y="100" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F2EEF8" letter-spacing="1">Let's connect</text>
  <line x1="420" y1="118" x2="780" y2="118" stroke="url(#hc-line)" stroke-width="1.5">
    <animate attributeName="x1" values="400;460;400" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="800;740;800" dur="6s" repeatCount="indefinite"/>
  </line>

  <text x="600" y="158" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B9AFC9">
    Open to connecting with developers, learning from experienced engineers,
  </text>
  <text x="600" y="182" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B9AFC9">
    and exploring suitable entry-level opportunities in software development.
  </text>

  <text x="600" y="226" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#B57BEE" letter-spacing="3">
    USE THE BADGES ABOVE TO REACH OUT
  </text>
</svg>
