<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Technology toolbox">
  <defs>
    <linearGradient id="htb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14121C"/>
      <stop offset="100%" stop-color="#0B0A10"/>
    </linearGradient>
    <linearGradient id="htb-chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D2A52"/>
      <stop offset="100%" stop-color="#241A33"/>
    </linearGradient>
    <linearGradient id="htb-chip2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#241A33"/>
      <stop offset="100%" stop-color="#3D2A52"/>
    </linearGradient>
    <linearGradient id="htb-chip3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A2138"/>
      <stop offset="100%" stop-color="#3D2A52"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="16" fill="url(#htb-bg)"/>
  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" fill="#B57BEE" letter-spacing="3">
    <text x="60" y="46">06 / TOOLBOX</text>
  </g>
  <text x="60" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F2EEF8">Technology toolbox</text>

  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#B9AFC9" letter-spacing="2">
    <text x="60" y="126">FRONTEND</text>
    <text x="60" y="196">LANGUAGES</text>
    <text x="60" y="266">SYSTEMS &amp; TOOLS</text>
  </g>

  <!-- Row 1: Frontend -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F2EEF8">
    <g><rect x="180" y="108" width="130" height="34" rx="17" fill="url(#htb-chip)"><animate attributeName="opacity" values="0.75;1;0.75" dur="5s" repeatCount="indefinite"/></rect><text x="245" y="130" text-anchor="middle">React</text></g>
    <g><rect x="322" y="108" width="130" height="34" rx="17" fill="url(#htb-chip2)"><animate attributeName="opacity" values="1;0.75;1" dur="5.5s" repeatCount="indefinite"/></rect><text x="387" y="130" text-anchor="middle">Vite</text></g>
    <g><rect x="464" y="108" width="160" height="34" rx="17" fill="url(#htb-chip)"><animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/></rect><text x="544" y="130" text-anchor="middle">Tailwind</text></g>
    <g><rect x="636" y="108" width="160" height="34" rx="17" fill="url(#htb-chip2)"><animate attributeName="opacity" values="1;0.75;1" dur="6.5s" repeatCount="indefinite"/></rect><text x="716" y="130" text-anchor="middle">HTML / CSS</text></g>
    <g><rect x="808" y="108" width="150" height="34" rx="17" fill="url(#htb-chip3)"><animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/></rect><text x="883" y="130" text-anchor="middle">JavaScript</text></g>
    <g><rect x="970" y="108" width="160" height="34" rx="17" fill="url(#htb-chip)"><animate attributeName="opacity" values="1;0.75;1" dur="7.5s" repeatCount="indefinite"/></rect><text x="1050" y="130" text-anchor="middle">Responsive</text></g>
  </g>

  <!-- Row 2: Languages -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F2EEF8">
    <g><rect x="180" y="178" width="130" height="34" rx="17" fill="url(#htb-chip2)"><animate attributeName="opacity" values="1;0.75;1" dur="5.2s" repeatCount="indefinite"/></rect><text x="245" y="200" text-anchor="middle">Python</text></g>
    <g><rect x="322" y="178" width="160" height="34" rx="17" fill="url(#htb-chip)"><animate attributeName="opacity" values="0.75;1;0.75" dur="5.7s" repeatCount="indefinite"/></rect><text x="402" y="200" text-anchor="middle">JavaScript</text></g>
    <g><rect x="494" y="178" width="130" height="34" rx="17" fill="url(#htb-chip3)"><animate attributeName="opacity" values="1;0.75;1" dur="6.2s" repeatCount="indefinite"/></rect><text x="559" y="200" text-anchor="middle">Bash</text></g>
    <g><rect x="636" y="178" width="130" height="34" rx="17" fill="url(#htb-chip2)"><animate attributeName="opacity" values="0.75;1;0.75" dur="6.7s" repeatCount="indefinite"/></rect><text x="701" y="200" text-anchor="middle">SQL</text></g>
    <g><rect x="778" y="178" width="160" height="34" rx="17" fill="url(#htb-chip)"><animate attributeName="opacity" values="1;0.75;1" dur="7.2s" repeatCount="indefinite"/></rect><text x="858" y="200" text-anchor="middle">Markdown</text></g>
  </g>

  <!-- Row 3: Systems & tools -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F2EEF8">
    <g><rect x="180" y="248" width="130" height="34" rx="17" fill="url(#htb-chip)"><animate attributeName="opacity" values="0.75;1;0.75" dur="5.4s" repeatCount="indefinite"/></rect><text x="245" y="270" text-anchor="middle">Linux</text></g>
    <g><rect x="322" y="248" width="140" height="34" rx="17" fill="url(#htb-chip2)"><animate attributeName="opacity" values="1;0.75;1" dur="5.9s" repeatCount="indefinite"/></rect><text x="392" y="270" text-anchor="middle">Ubuntu</text></g>
    <g><rect x="474" y="248" width="140" height="34" rx="17" fill="url(#htb-chip3)"><animate attributeName="opacity" values="0.75;1;0.75" dur="6.4s" repeatCount="indefinite"/></rect><text x="544" y="270" text-anchor="middle">Kali</text></g>
    <g><rect x="626" y="248" width="130" height="34" rx="17" fill="url(#htb-chip)"><animate attributeName="opacity" values="1;0.75;1" dur="6.9s" repeatCount="indefinite"/></rect><text x="691" y="270" text-anchor="middle">Git</text></g>
    <g><rect x="768" y="248" width="140" height="34" rx="17" fill="url(#htb-chip2)"><animate attributeName="opacity" values="0.75;1;0.75" dur="7.4s" repeatCount="indefinite"/></rect><text x="838" y="270" text-anchor="middle">GitHub</text></g>
    <g><rect x="920" y="248" width="220" height="34" rx="17" fill="url(#htb-chip3)"><animate attributeName="opacity" values="1;0.75;1" dur="7.9s" repeatCount="indefinite"/></rect><text x="1030" y="270" text-anchor="middle">Qwen2.5 · LoRA · GGUF</text></g>
  </g>

  <text x="60" y="330" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#B9AFC9">
    Explored through hands-on practice — not a claim of expert-level proficiency.
  </text>
</svg>
