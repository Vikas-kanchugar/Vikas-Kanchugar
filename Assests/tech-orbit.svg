<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-labelledby="orbitTitle orbitDesc">
  <title id="orbitTitle">Developer technology orbit</title>
  <desc id="orbitDesc">Abstract orbital paths and moving dots in a professional blue, teal, and violet palette.</desc>
  <defs>
    <linearGradient id="orbitBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="orbitLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".2"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#A78BFA" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="160" rx="16" fill="url(#orbitBg)"/>
  <g fill="none" stroke="url(#orbitLine)" stroke-width="1.4">
    <ellipse cx="500" cy="80" rx="300" ry="45"/>
    <ellipse cx="500" cy="80" rx="220" ry="60" transform="rotate(24 500 80)"/>
    <ellipse cx="500" cy="80" rx="220" ry="60" transform="rotate(-24 500 80)"/>
    <circle cx="500" cy="80" r="25" stroke="#2DD4BF" stroke-opacity=".75"/>
  </g>
  <circle cx="500" cy="80" r="5" fill="#F8FAFC"/>
  <circle cx="200" cy="80" r="4" fill="#38BDF8">
    <animate attributeName="cx" values="200;800;200" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="20" r="4" fill="#A78BFA">
    <animate attributeName="cy" values="20;140;20" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#CBD5E1" letter-spacing="3">CODE  ·  SYSTEMS  ·  CURIOSITY</text>
</svg>
