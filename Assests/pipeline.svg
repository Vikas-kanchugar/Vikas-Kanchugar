<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Process pipeline">
  <defs>
    <linearGradient id="hpl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0A10"/>
      <stop offset="100%" stop-color="#14121C"/>
    </linearGradient>
    <linearGradient id="hpl-track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D2A52"/>
      <stop offset="50%" stop-color="#B57BEE"/>
      <stop offset="100%" stop-color="#E49A5C"/>
    </linearGradient>
    <radialGradient id="hpl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E49A5C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E49A5C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="200" rx="16" fill="url(#hpl-bg)"/>
  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#B57BEE" letter-spacing="3">
    <text x="60" y="46">09 / PROCESS</text>
  </g>

  <line x1="80" y1="110" x2="1120" y2="110" stroke="url(#hpl-track)" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="80" y1="110" x2="1120" y2="110" stroke="#B57BEE" stroke-width="2" stroke-opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0 1200;1200 1200" dur="10s" repeatCount="indefinite"/>
  </line>

  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#B9AFC9" text-anchor="middle" letter-spacing="2">
    <text x="140" y="152">DISCOVER</text>
    <text x="336" y="152">DEFINE</text>
    <text x="532" y="152">BUILD</text>
    <text x="728" y="152">VALIDATE</text>
    <text x="924" y="152">REFINE</text>
    <text x="1100" y="152">DELIVER</text>
  </g>

  <g fill="#3D2A52">
    <circle cx="140" cy="110" r="10"/><circle cx="336" cy="110" r="10"/><circle cx="532" cy="110" r="10"/>
    <circle cx="728" cy="110" r="10"/><circle cx="924" cy="110" r="10"/><circle cx="1100" cy="110" r="10"/>
  </g>
  <g fill="#F2EEF8">
    <circle cx="140" cy="110" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="336" cy="110" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="532" cy="110" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="728" cy="110" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="924" cy="110" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="110" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="140" cy="110" r="18" fill="url(#hpl-glow)">
    <animate attributeName="cx" values="140;1100;140" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="110" r="4" fill="#E49A5C">
    <animate attributeName="cx" values="140;1100;140" dur="12s" repeatCount="indefinite"/>
  </circle>
</svg>
