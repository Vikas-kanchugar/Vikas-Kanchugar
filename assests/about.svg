<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="About">
  <defs>
    <linearGradient id="ha-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0A10"/>
      <stop offset="100%" stop-color="#14121C"/>
    </linearGradient>
    <linearGradient id="ha-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D2A52"/>
      <stop offset="50%" stop-color="#B57BEE"/>
      <stop offset="100%" stop-color="#E49A5C"/>
      <animate attributeName="x1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="ha-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B57BEE" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#B57BEE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" rx="16" fill="url(#ha-bg)"/>

  <ellipse cx="1080" cy="80" rx="220" ry="120" fill="url(#ha-glow)">
    <animate attributeName="rx" values="180;250;180" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Animated border -->
  <rect x="1" y="1" width="1198" height="378" rx="16" fill="none" stroke="#3D2A52" stroke-width="1.5">
    <animate attributeName="stroke" values="#3D2A52;#B57BEE;#3D2A52" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Section tag -->
  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" fill="#B57BEE" letter-spacing="3">
    <text x="60" y="46">01 / ABOUT</text>
  </g>
  <text x="60" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#F2EEF8" letter-spacing="1">A short introduction</text>
  <rect x="60" y="102" width="180" height="3" rx="1.5" fill="url(#ha-bar)">
    <animate attributeName="width" values="60;240;60" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#F2EEF8" font-size="17">
    <text x="60" y="155">I'm Vikas Kanchugar, a 2026 BCA graduate exploring opportunities in software development</text>
    <text x="60" y="182">and related entry-level technology roles.</text>
    <text x="60" y="220" fill="#B9AFC9">I enjoy turning ideas into practical projects — from responsive web interfaces to experiments</text>
    <text x="60" y="247" fill="#B9AFC9">with local AI models and Linux tools. My approach is to keep learning, build things I can</text>
    <text x="60" y="274" fill="#B9AFC9">explain, and improve them through testing and iteration.</text>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9AFC9">
    <circle cx="72" cy="320" r="4" fill="#B57BEE"><animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/></circle>
    <text x="88" y="325">Software · frontend · AI · Python · Linux · cybersecurity</text>
    <circle cx="72" cy="348" r="4" fill="#E49A5C"><animate attributeName="r" values="3;5;3" dur="3.6s" repeatCount="indefinite"/></circle>
    <text x="88" y="353">Goal: strengthen core skills and contribute to a professional team</text>
  </g>

  <line x1="0" y1="0" x2="0" y2="380" stroke="#E49A5C" stroke-width="1" opacity="0.2">
    <animate attributeName="x1" values="0;1200;0" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1200;0" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="16s" repeatCount="indefinite"/>
  </line>
</svg>
